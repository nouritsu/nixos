inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # house style: treefmt, git hooks, dotenv, claude
  nixos:
    url: github:nouritsu/nixos
    flake: false
imports:
  - nixos/templates/base
